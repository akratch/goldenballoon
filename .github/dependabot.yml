version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A limit of 0 disables the ecosystem entirely, which made every setting
    # above inert. Actions are grouped into a single PR, so a small cap is
    # enough to keep the update surface reviewable.
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "build"
      - "release-hygiene"

# MGB64's dependabot.yml also has a "cargo" ecosystem block for
# tools/asm-processor/rust (a vendored Rust build tool). mdkr64 has no
# tools/asm-processor/ or any other vendored Rust code, so that block is
# dropped rather than ported — add an ecosystem block here if mdkr64 ever
# vendors a Rust (or other non-Actions) build dependency.
