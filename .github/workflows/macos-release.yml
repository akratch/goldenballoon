# Manual, asset-free macOS release pipeline. Produces a Developer ID signed,
# notarized, stapled, and Gatekeeper-assessed Apple-silicon DMG. No ROM or
# ROM-derived asset is accepted by this workflow.

name: macOS signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, without a v prefix (for example 1.0.1)"
        required: true
        default: "1.0.0"
      release_tag:
        description: "Optional existing GitHub Release tag to upload into"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  package:
    name: Sign, notarize, and package macOS
    runs-on: macos-14
    timeout-minutes: 45
    environment: macos-release

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "version must look like 1.0 or 1.0.1 (no v prefix)" >&2
            exit 1
          }

      - name: Install build dependencies
        run: brew install sdl2 cmake pkg-config

      - name: Build self-contained ad-hoc integrity bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./macos/Scripts/build_app_bundle.sh \
            --release \
            --build-dir build-macos-release \
            --output dist/mdkr64.app \
            --version "$RELEASE_VERSION" \
            --bundle-sdl2
          ./macos/Scripts/verify_asset_free.sh dist/mdkr64.app
          ./macos/Scripts/verify_gatekeeper_bundle.sh dist/mdkr64.app

      - name: Import certificate, sign, notarize, and build final DMG
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing repository secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing repository secret}"
          : "${DEVELOPER_ID_APPLICATION:?missing repository variable}"
          : "${APPLE_API_PRIVATE_KEY_BASE64:?missing repository secret}"
          : "${APPLE_API_KEY_ID:?missing repository secret}"
          : "${APPLE_API_ISSUER_ID:?missing repository secret}"

          KEYCHAIN_PATH="$RUNNER_TEMP/mdkr-release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export APPLE_API_KEY_PATH

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"
          }
          trap cleanup EXIT

          python3 - "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          for variable, path in (
              ("MACOS_CERTIFICATE_P12_BASE64", sys.argv[1]),
              ("APPLE_API_PRIVATE_KEY_BASE64", sys.argv[2]),
          ):
              with open(path, "wb") as output:
                  output.write(base64.b64decode(os.environ[variable], validate=True))
          PY
          chmod 600 "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          ./macos/Scripts/sign_and_notarize.sh dist/mdkr64.app
          ./macos/Scripts/verify_gatekeeper_bundle.sh \
            --distribution dist/mdkr64.app

          DMG_PATH="dist/golden-balloon-${RELEASE_VERSION}.dmg"
          ./macos/Scripts/create_dmg.sh dist/mdkr64.app "$DMG_PATH"
          codesign --force --sign "$DEVELOPER_ID_APPLICATION" \
            --timestamp "$DMG_PATH"
          ./macos/Scripts/notarize_artifact.sh "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

          ./tools/release/stamp_provenance.sh "$DMG_PATH" "$RELEASE_VERSION"
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: golden-balloon-macos-${{ inputs.version }}
          path: |
            dist/golden-balloon-${{ inputs.version }}.dmg
            dist/golden-balloon-${{ inputs.version }}.dmg.sha256
            dist/golden-balloon-${{ inputs.version }}.dmg.provenance.json
          if-no-files-found: error

  publish:
    name: Publish signed macOS artifact
    if: ${{ inputs.release_tag != '' }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: golden-balloon-macos-${{ inputs.version }}
          path: dist

      - name: Revalidate artifact identity and publish to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/golden-balloon-${RELEASE_VERSION}.dmg"
          shasum -a 256 -c "${DMG_PATH}.sha256"
          python3 - "${DMG_PATH}.provenance.json" "$DMG_PATH" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          sidecar = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifact = pathlib.Path(sys.argv[2])
          expected = {
              "artifact": artifact.name,
              "commit": os.environ["SOURCE_COMMIT"],
              "platform": "macos",
              "version": os.environ["RELEASE_VERSION"],
          }
          for key, value in expected.items():
              if sidecar.get(key) != value:
                  raise SystemExit(f"provenance {key} mismatch")
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if sidecar.get("sha256") != digest:
              raise SystemExit("provenance sha256 mismatch")
          PY
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "$DMG_PATH" "${DMG_PATH}.sha256" "${DMG_PATH}.provenance.json"
