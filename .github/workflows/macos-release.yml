# Manual, asset-free macOS release pipeline. The default patch-release path
# produces an ad-hoc integrity-sealed (not Developer ID signed or notarized)
# Apple-silicon DMG. The protected credentialed path remains available when
# explicitly requested. No ROM or ROM-derived asset is accepted.

name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, without a v prefix (for example 1.0.5)"
        required: true
        default: "1.0.6"
      trusted_signing:
        description: "Developer ID sign and notarize (requires protected credentials)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Optional v<version> release tag; must resolve to this workflow commit"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  package:
    name: Build and package macOS
    runs-on: macos-14
    timeout-minutes: 45
    environment: macos-release

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          TRUSTED_SIGNING: ${{ inputs.trusted_signing }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "version must look like 1.0 or 1.0.4 (no v prefix)" >&2
            exit 1
          }
          if [[ "$TRUSTED_SIGNING" == "true" && -n "$RELEASE_TAG" ]]; then
            echo "trusted signing artifacts cannot be published until the documented post-sign LaunchServices/WebGPU runtime gate is automated" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            EXPECTED_RELEASE_TAG="v${RELEASE_VERSION}"
            [[ "$RELEASE_TAG" == "$EXPECTED_RELEASE_TAG" ]] || {
              echo "release_tag must exactly equal $EXPECTED_RELEASE_TAG" >&2
              exit 1
            }
            TAG_COMMIT="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
            [[ "$TAG_COMMIT" == "$GITHUB_SHA" ]] || {
              echo "release_tag resolves to $TAG_COMMIT, not $GITHUB_SHA" >&2
              exit 1
            }
          fi

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Build pinned standalone SDL2 for macOS 13
        run: |
          source ./macos/Scripts/release_sdl2_config.sh
          SDL_WORK_DIR="$RUNNER_TEMP/sdl2-${MDKR_RELEASE_SDL2_VERSION}"
          ./macos/Scripts/build_release_sdl2.sh \
            --work-dir "$SDL_WORK_DIR" \
            --prefix "$SDL_WORK_DIR/install" \
            --arch arm64 \
            --deployment-target 13.0
          printf 'MDKR_RELEASE_SDL2_PREFIX=%s\n' \
            "$SDL_WORK_DIR/install" >> "$GITHUB_ENV"

      - name: Build self-contained ad-hoc integrity bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          : "${MDKR_RELEASE_SDL2_PREFIX:?pinned SDL2 prefix was not exported}"
          export PKG_CONFIG_PATH="${MDKR_RELEASE_SDL2_PREFIX}/lib/pkgconfig"
          ./macos/Scripts/build_app_bundle.sh \
            --release \
            --build-dir build-macos-release \
            --output dist/mdkr64.app \
            --arch arm64 \
            --version "$RELEASE_VERSION" \
            --build-stamp "$GITHUB_SHA" \
            --deployment-target 13.0 \
            --strict-deployment-target \
            --bundle-sdl2
          ./macos/Scripts/verify_asset_free.sh dist/mdkr64.app
          ./macos/Scripts/verify_gatekeeper_bundle.sh dist/mdkr64.app
          ./macos/Scripts/verify_unsigned_release.sh \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" \
            dist/mdkr64.app

      - name: Import certificate, sign, notarize, and build final DMG
        if: ${{ inputs.trusted_signing }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing repository secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing repository secret}"
          : "${DEVELOPER_ID_APPLICATION:?missing repository variable}"
          : "${APPLE_API_PRIVATE_KEY_BASE64:?missing repository secret}"
          : "${APPLE_API_KEY_ID:?missing repository secret}"
          : "${APPLE_API_ISSUER_ID:?missing repository secret}"

          KEYCHAIN_PATH="$RUNNER_TEMP/mdkr-release.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export APPLE_API_KEY_PATH

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"
          }
          trap cleanup EXIT

          python3 - "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH" <<'PY'
          import base64
          import os
          import sys

          for variable, path in (
              ("MACOS_CERTIFICATE_P12_BASE64", sys.argv[1]),
              ("APPLE_API_PRIVATE_KEY_BASE64", sys.argv[2]),
          ):
              with open(path, "wb") as output:
                  output.write(base64.b64decode(os.environ[variable], validate=True))
          PY
          chmod 600 "$CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          ./macos/Scripts/sign_and_notarize.sh dist/mdkr64.app
          ./macos/Scripts/verify_gatekeeper_bundle.sh \
            --distribution dist/mdkr64.app

          DMG_PATH="dist/Golden-Balloon-${RELEASE_VERSION}-macos-arm64-signed-notarized.dmg"
          ./macos/Scripts/create_dmg.sh dist/mdkr64.app "$DMG_PATH"
          codesign --force --sign "$DEVELOPER_ID_APPLICATION" \
            --timestamp "$DMG_PATH"
          ./macos/Scripts/notarize_artifact.sh "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

          ./macos/Scripts/stamp_macos_provenance.sh \
            --signing developer-id-notarized "$DMG_PATH" "$RELEASE_VERSION"
          DMG_DIR="$(dirname "$DMG_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          (
            cd "$DMG_DIR"
            shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          )

      - name: Build intentionally unsigned patch-release DMG
        if: ${{ !inputs.trusted_signing }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/Golden-Balloon-${RELEASE_VERSION}-macos-arm64-unsigned.dmg"
          ./macos/Scripts/create_dmg.sh dist/mdkr64.app "$DMG_PATH"
          ./macos/Scripts/verify_unsigned_dmg.sh \
            --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" "$DMG_PATH"
          ./macos/Scripts/stamp_macos_provenance.sh \
            --signing ad-hoc-unsigned "$DMG_PATH" "$RELEASE_VERSION"
          DMG_DIR="$(dirname "$DMG_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          (
            cd "$DMG_DIR"
            shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          )
          echo "::notice::This artifact is ad-hoc integrity sealed but intentionally not Developer ID signed or notarized. Users should expect macOS's unidentified-developer warning, never a damaged-app error."

      # Fail closed between stamping and upload, through the same verifier the
      # publish job re-runs on the downloaded artifact.
      - name: Verify provenance of the packaged DMG before upload
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SIGNING: ${{ inputs.trusted_signing && 'developer-id-notarized' || 'ad-hoc-unsigned' }}
        run: |
          set -euo pipefail
          ./tools/release/verify_provenance.sh \
            --dist dist \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --require platform=macos \
            --require "macos_signing=$EXPECTED_SIGNING"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: Golden-Balloon-${{ inputs.version }}-macos-arm64-${{ inputs.trusted_signing && 'signed-notarized' || 'unsigned' }}
          path: |
            dist/Golden-Balloon-${{ inputs.version }}-macos-arm64-*.dmg
            dist/Golden-Balloon-${{ inputs.version }}-macos-arm64-*.dmg.sha256
            dist/Golden-Balloon-${{ inputs.version }}-macos-arm64-*.dmg.provenance.json
          if-no-files-found: error

  publish:
    name: Publish macOS artifact
    # The unsigned patch path has a post-seal LaunchServices/WebGPU runtime
    # gate. Keep trusted artifacts upload-only until the equivalent post-sign,
    # post-staple gate is automated; documentation alone must not authorize a
    # public upload.
    if: ${{ inputs.release_tag != '' && !inputs.trusted_signing }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The publish job is the step that writes to a public release, so it is the
    # one that must carry the protected environment's reviewers and rules. The
    # build job keeps it as well: the trusted-signing path reads Developer ID
    # and notarization credentials scoped to that environment.
    environment: macos-release
    permissions:
      contents: write
    steps:
      - name: Checkout provenance tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download macOS workflow artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Golden-Balloon-${{ inputs.version }}-macos-arm64-${{ inputs.trusted_signing && 'signed-notarized' || 'unsigned' }}
          path: dist

      - name: Revalidate artifact identity and publish to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          TRUSTED_SIGNING: ${{ inputs.trusted_signing }}
        run: |
          set -euo pipefail
          EXPECTED_RELEASE_TAG="v${RELEASE_VERSION}"
          [[ "$RELEASE_TAG" == "$EXPECTED_RELEASE_TAG" ]] || {
            echo "release_tag must exactly equal $EXPECTED_RELEASE_TAG" >&2
            exit 1
          }
          TAG_COMMIT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          [[ "$TAG_COMMIT" == "$SOURCE_COMMIT" ]] || {
            echo "release_tag resolves to $TAG_COMMIT, not $SOURCE_COMMIT" >&2
            exit 1
          }
          [[ "$TRUSTED_SIGNING" == "false" ]] || {
            echo "trusted macOS publication is disabled until post-sign runtime qualification is automated" >&2
            exit 1
          }
          DMG_PATH="dist/Golden-Balloon-${RELEASE_VERSION}-macos-arm64-unsigned.dmg"
          DMG_DIR="$(dirname "$DMG_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          (
            cd "$DMG_DIR"
            shasum -a 256 -c "$DMG_NAME.sha256"
          )
          # One provenance implementation for every lane: the shared verifier
          # asserts artifact/digest/version/commit and a clean source tree, and
          # --require adds this lane's macOS-specific sidecar fields.
          ./tools/release/verify_provenance.sh \
            --dist "$DMG_DIR" \
            --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" \
            --require platform=macos \
            --require macos_signing=ad-hoc-unsigned
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$DMG_PATH" "${DMG_PATH}.sha256" "${DMG_PATH}.provenance.json"
