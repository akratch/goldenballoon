name: web-demo

# GUARDED PUBLISH. workflow_dispatch only -- this never fires on push, tag, or
# schedule. Publishing a playable build is an owner decision made deliberately,
# not a side effect of committing. (Same doctrine as mgb64's web-demo workflow.)
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        # scoped to the Pages deployment only
  id-token: write     # required by deploy-pages OIDC; grants nothing else

# Cancelling is safe for the BUILD (a superseded build produces nothing anyone
# is waiting on) and is not safe for the Pages DEPLOYMENT: cancelling one
# mid-flight can leave the site on a partially replaced payload. Per GitHub's
# own Pages guidance the deployment queues instead of cancelling, so the two jobs
# carry separate concurrency policies rather than one workflow-level rule.

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: web-demo-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Actions pinned to commit SHAs, not tags: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with: { version: "4.0.10" }

      - name: Build (WebGPU browser target)
        run: EMSDK_DIR="$EMSDK" tools/web/build_web.sh

      - name: Candidate web provenance (fail-closed)
        run: tools/ci/check_release_ready.sh --candidate --web-dir dist/web

      - name: Validate linked wasm wave table
        run: python3 tests/check_wave_visible_table.py --wasm dist/web/mdkr64_web.wasm

      # build_web.sh already enforces both of the following. They are repeated here
      # so the release gate does not depend on a script the build could have
      # skipped, and so the failure is visible as its own red step.
      - name: Size budget (fail-closed)
        run: |
          set -euo pipefail
          sz=$(stat -c%s dist/web/mdkr64_web.wasm)
          save_sz=$(stat -c%s dist/web/mdkr-save-tools.wasm)
          echo "wasm size: $sz bytes"
          echo "save tools wasm size: $save_sz bytes"
          test "$sz" -lt 41943040   # 40 MiB; Pages per-file limit is 100 MiB
          test "$save_sz" -lt 524288

      - name: ROM revision table parity (browser mirrors the engine)
        # The shell refuses unsupported cartridges from its own copy of the
        # revision table. Publishing a drifted copy would let the browser accept
        # a revision the engine cannot run, or refuse one it can. The runtime
        # half of this (tests/check_rom_revision.py) needs a native build and a
        # ROM; neither may exist here, so the table half runs from the same
        # parser instead.
        run: python3 tools/web/check_rom_id_mirror.py

      - name: ROM-absence guard (fail-closed)
        # THE legal gate. Golden Balloon is bring-your-own-ROM: the player supplies
        # a copy they own and it is read client-side, never uploaded. Nothing
        # ROM-derived may ship. This proves that about the actual artifacts --
        # structural header-magic checks in all three N64 byte orders at offset 0,
        # plus the big-endian magic sequence anywhere in each file. See
        # tools/check_no_rom.sh for why it is not a string search.
        run: tools/check_no_rom.sh dist/web

      - name: Browser save custody (ROM/WebGPU independent)
        run: >-
          python3 tests/check_browser_save_ui.py
          --engine-dir dist/web
          --shell-dir dist/web
          --chrome google-chrome
          --timeout 90

      - name: Verify no ROM was committed to the tree either
        run: |
          set -euo pipefail
          if git ls-files | grep -iE '\.(z64|n64|v64)$'; then
            echo "A ROM is tracked in git. Refusing to publish." >&2
            exit 1
          fi
          echo "no ROM tracked in git"

      # Test the complete deferred implementation above, then publish a separate
      # local-only payload. The release copy contains no cloud controls, role
      # pages, scripts, precache entries or online-only wasm; future work stays
      # testable in dist/web without becoming discoverable in this release.
      - name: Prepare stamped local-only publication
        run: |
          set -euo pipefail
          rm -rf publish-web-full publish-web
          cp -a dist/web publish-web-full
          tools/web/stamp_publish.sh \
            --dir publish-web-full --stamp "${GITHUB_SHA::7}"
          python3 tools/web/prepare_local_only_release.py \
            --source publish-web-full --out publish-web
          tools/check_no_rom.sh publish-web

      - name: Rendered local-only release surface
        run: >-
          python3 tests/check_browser_local_only_release.py
          --shell-dir publish-web
          --chrome google-chrome
          --timeout 90

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: publish-web }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A queued deployment must replace the site completely or not at all.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
