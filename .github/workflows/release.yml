# Release build pipeline — qualified Linux artifacts + Windows validation.
#
# Adapted from mgb64's .github/workflows/release.yml. Produces the portable
# prebuilt binaries that this Mac can't build natively. Linux's AppImage and
# tarball are publishable because this workflow launches their real AppHost
# through both renderers and validates captured pixels. The Windows portable
# zip is built and inspected, then preserved as a workflow artifact but never
# attached to a public release automatically: windows-latest
# does not guarantee a qualifying D3D12/Vulkan adapter or GL 3.3 context, so a
# real launcher gate there would be flaky and a headless CLI smoke would be a
# false substitute. Automatic Windows publication is disabled; a maintainer
# may attach only the exact archive that passed real-hardware acceptance.
# macOS is built and validated by
# .github/workflows/macos-release.yml (standalone dependencies, integrity
# sealing, mounted-DMG verification, and an optional Developer ID/notarization
# lane); a maintainer assembles the final GitHub Release from all sources.
#
# Manual-only, matching the repo's local-CI posture (see correctness.yml,
# whose push/pull_request/workflow_dispatch triggers are the only automatic
# ones this repo runs -- release/validation lanes are deliberate maintainer
# actions): a maintainer dispatches this deliberately. The jobs need no
# repository secrets and write no repository state — they compile only the
# ASSET-FREE source, and only the fully GPU-qualified Linux result is uploaded,
# consistent with the bring-your-own-ROM / no-hosted-auto-triggers provenance
# policy.
#
# The `mdkr64` target includes the native launcher shell. Release validation
# remains asset-free: launcher rendering, `--help`, and `--video-list` need no
# ROM, while gameplay artifacts are never generated in hosted release jobs.
#
# There is no PortMaster/GLES analog in this repo (that was a GoldenEye/mgb64
# handheld-porting effort with no mdkr64 counterpart), so that job is not
# ported.
#
# macos/Scripts/verify_asset_free.sh (used by the Linux job's "Verify
# asset-free" step below) landed on `main` via the macOS packaging port
# during the development of this workflow.

name: Portable release (Linux qualified; Windows validation only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bare semver for releases (for example 1.2.3, without a v prefix); use dev only for test artifacts"
        required: false
        default: "dev"
      release_tag:
        description: "Required v<version> tag for release artifacts; leave empty only with version=dev"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate release inputs and source policy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      party_origin: ${{ steps.party.outputs.party_origin }}
    steps:
      - name: Checkout full tag history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" != "dev" &&
                ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "version must be dev or bare semver (for example 1.2.3)" >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == "dev" ]]; then
            [[ -z "$RELEASE_TAG" ]] || {
              echo "release_tag must be empty when version=dev" >&2
              exit 1
            }
          else
            EXPECTED_RELEASE_TAG="v${RELEASE_VERSION}"
            [[ "$RELEASE_TAG" == "$EXPECTED_RELEASE_TAG" ]] || {
              echo "release_tag must exactly equal $EXPECTED_RELEASE_TAG" >&2
              exit 1
            }
            TAG_COMMIT="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
            [[ "$TAG_COMMIT" == "$GITHUB_SHA" ]] || {
              echo "release_tag resolves to $TAG_COMMIT, not $GITHUB_SHA" >&2
              exit 1
            }
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      # Phone Party origin gate. MDKR_PARTY_ORIGIN is COMPILED INTO the
      # launcher (CMakeLists.txt), so an artifact built without it shows no
      # Phone Party surface at all (PhoneParty_availableInBuild): players get a
      # build that does not have the feature, silently and irreversibly. No
      # release lane used to set it, which made every packaged artifact
      # partyless for three releases. Fail closed here, before anything
      # is built: either a valid deployed origin is configured, or a partyless
      # release is declared on purpose and said out loud in the log. The build
      # jobs consume the resolved value as this job's `party_origin` output.
      - id: party
        name: Resolve and gate the compiled Phone Party origin
        env:
          PARTY_ORIGIN: ${{ vars.MDKR_PARTY_ORIGIN }}
          ALLOW_PARTYLESS: ${{ vars.MDKR_ALLOW_PARTYLESS_RELEASE }}
        run: |
          set -euo pipefail
          origin="${PARTY_ORIGIN:-}"
          allow="${ALLOW_PARTYLESS:-}"
          if [[ -n "$origin" ]]; then
            # Exactly https://HOST[:PORT]. A trailing slash, path, query,
            # fragment or embedded credentials all change the URL the phone
            # dials, and the service compares origins byte for byte.
            if [[ ! "$origin" =~ ^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$ ]]; then
              echo "::error::vars.MDKR_PARTY_ORIGIN must be exactly https://HOST[:PORT] with no trailing slash, path, query, fragment or credentials (got '$origin')"
              exit 1
            fi
            host="${origin#https://}"
            host="$(printf '%s' "${host%%:*}" | tr '[:upper:]' '[:lower:]')"
            case "$host" in
              localhost|*.invalid|*.example|example.com|example.net|example.org|*.example.com|*.example.net|*.example.org)
                echo "::error::vars.MDKR_PARTY_ORIGIN is a reserved placeholder host ('$host'); a release must be built against the deployed Phone Party service"
                exit 1
                ;;
            esac
            echo "Phone Party origin compiled into this release: $origin"
          elif [[ "$allow" == "1" ]]; then
            echo "::warning::PARTYLESS RELEASE: these artifacts ship with Phone Party absent"
            echo "=============================================================="
            echo "PARTYLESS RELEASE (vars.MDKR_ALLOW_PARTYLESS_RELEASE=1)"
            echo "These artifacts ship with Phone Party UNAVAILABLE. With no"
            echo "compiled origin the launcher shows no Phone Party surface at"
            echo "all -- players get a build that does not have the feature."
            echo "To ship a working Phone Party, set the repository variable"
            echo "MDKR_PARTY_ORIGIN to the deployed https:// origin and re-run."
            echo "=============================================================="
          else
            echo "::error::No Phone Party origin for this release: these artifacts would ship with Phone Party absent (an origin-less build shows no Phone Party surface at all). Set the repository variable MDKR_PARTY_ORIGIN to the deployed https:// origin, or set MDKR_ALLOW_PARTYLESS_RELEASE=1 to ship deliberately without Phone Party."
            exit 1
          fi
          echo "party_origin=$origin" >> "$GITHUB_OUTPUT"
      # A dispatch can name any ref. Run the same clean-room / public-surface
      # policy gates correctness.yml runs, before anything is built or
      # published, so an unvetted ref cannot ship.
      - name: Clean-room history
        run: tools/check_clean_room.sh
      - name: Public tracked-tree boundary
        run: python3 tools/check_public_surface.py --tree "$GITHUB_SHA"
      - name: Native SDK surface, third-party notices, and image metadata
        run: |
          python3 tools/check_native_sdk_surface.py
          python3 tools/check_third_party_notices.py
          python3 tools/check_image_metadata.py

  linux:
    name: Linux app (AppImage + tar.gz)
    needs: validate
    runs-on: ubuntu-22.04  # oldest-reasonable glibc for broad compatibility
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libsdl2-dev libgl1-mesa-dev \
            libdbus-1-dev file wget xvfb xauth mesa-vulkan-drivers \
            libgl1-mesa-dri vulkan-tools
          test -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - name: Build the app (Release)
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          # Gated by the validate job: either a valid deployed https:// origin
          # or, deliberately and loudly, empty. Empty stays legal (that is the
          # partyless path), so this must not be quoted away or defaulted.
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DMDKR_VERSION="$RELEASE_VERSION" \
            -DMDKR_PARTY_ORIGIN="$PARTY_ORIGIN"
          cmake --build build -j
      - name: ROM-free unit tests (GPU tests routed separately)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -LE gpu
      - name: Verify built executable identity and ROM-free surfaces
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          version_output="$(./build/mdkr64 --version | tr -d '\r')"
          test "$version_output" = "mdkr64 ${{ needs.validate.outputs.version }}"
          ./macos/Scripts/verify_asset_free.sh build/mdkr64
          ./build/mdkr64 --help | tee "$RUNNER_TEMP/linux-help.txt"
          grep -q '^Usage: ' "$RUNNER_TEMP/linux-help.txt"
          ./build/mdkr64 --video-list | tee "$RUNNER_TEMP/linux-video.txt"
          grep -qE '^\[video\] mode=' "$RUNNER_TEMP/linux-video.txt"
      # What this proves headlessly: the Phone Party host's pairing surface
      # (secure-origin bootstrap, invite URL + six-digit code, QR encoding,
      # pairing phrase, fail-closed on a missing/insecure origin) through the
      # real MdkrNativePartyHost, and that the shipped executable actually
      # links that host and the native WSS/WebRTC transport. What the launcher
      # itself draws is proven separately, by the MDKR_APP_PARTY_TRACE witness
      # in the two AppHost qualification steps below.
      - name: Phone Party bring-up smoke and linked-transport check (built tree)
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          set -euo pipefail
          built_version="$(./build/mdkr64 --version | tr -d '\r')"
          test "$built_version" = "mdkr64 $RELEASE_VERSION"
          # Stamp the smoke record with the version the executable itself
          # reported, so the evidence is bound to this build.
          MDKR_PARTY_BRINGUP_VERSION="${built_version#mdkr64 }" \
            ./build/mdkr_native_party_bringup_test \
            | tee "$RUNNER_TEMP/party-bringup-built.txt"
          grep -qE "^\[party-bringup\] version=${RELEASE_VERSION} .* ok=1\$" \
            "$RUNNER_TEMP/party-bringup-built.txt"
          if [[ -n "${PARTY_ORIGIN:-}" ]]; then
            python3 tests/check_party_binary_surface.py build/mdkr64 \
              --expect-origin "$PARTY_ORIGIN"
          else
            echo "Partyless build: packaged Phone Party surface assertion is intentionally absent."
          fi
      - name: Qualify built AppHost pixels (lavapipe WebGPU + llvmpipe OpenGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/launcher-built"
          chmod 700 "$XDG_RUNTIME_DIR"

          qualify_launcher() {
            local label="$1" renderer="$2" executable="$3"
            local work="$RUNNER_TEMP/launcher-built/$label"
            mkdir -p "$work/prefs" "$work/saves"
            local -a backend=(-u MDKR_RENDERER)
            [[ -z "$renderer" ]] || backend=(MDKR_RENDERER="$renderer")
            xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
              env -u SDL_VIDEODRIVER "${backend[@]}" \
                MDKR_APP_SMOKE_FRAMES=4 \
                MDKR_APP_SMOKE_SHOT="$work/launcher.bmp" \
                MDKR_APP_PANEL=Settings MDKR_APP_UI_TRACE=1 \
                MDKR_APP_REQUIRE_PRESENT=1 \
                MDKR_APP_PREFS_DIR="$work/prefs" \
                MDKR_VIDEO_CONFIG_PATH="$work/video.ini" \
                MDKR_SAVE_DIR="$work/saves" MDKR_AUDIO=0 \
                "$executable" 2>&1 | tee "$work/launcher.log"
            if [[ -z "$renderer" ]]; then
              grep -Fq '[app] host: WebGPU' "$work/launcher.log"
              grep -Eq '^\[app\] smoke: surface presents=[1-9][0-9]*$' \
                "$work/launcher.log"
            else
              grep -Fq '[app] host: OpenGL' "$work/launcher.log"
            fi
            python3 tests/check_app_capture.py "$work/launcher.bmp" --self-test
          }

          qualify_launcher webgpu "" "$GITHUB_WORKSPACE/build/mdkr64"
          qualify_launcher gl gl "$GITHUB_WORKSPACE/build/mdkr64"

          # Phone Party surface witness (direct, not a proxy). The party
          # section lives on the launcher's Play panel, so this run opens that
          # panel with MDKR_APP_PARTY_TRACE=1 armed. The trace line is emitted
          # once per process, from inside the party draw itself, after the
          # surface has committed draws -- a frame that skipped the surface
          # cannot report it (platform/app/ui_phone_party.cpp).
          #
          # A build with no compiled origin shows no Phone Party surface at all
          # (PhoneParty_availableInBuild); only the trace lane still draws it,
          # reporting origin=unset. So a NONEMPTY origin in this line is direct
          # evidence that a real player of this artifact gets the surface.
          #
          # PROVEN here: the shipped launcher's party surface really drew, it
          # reports the origin THIS artifact was compiled with, and the native
          # WSS/WebRTC transport is linked and available.
          # NOT proven here: pairing. With no ROM and no network the phase is
          # `closed` and the invite/QR/code draw flags are 0, so they are not
          # asserted -- an assertion that cannot hold in this lane would be
          # worse than none. Live pairing is tools/verify_party_deploy.py's
          # job, against the same origin.
          # Pixels and presents are the four qualification runs above; this run
          # exists only for the party trace, so it does not repeat those
          # assertions. The trace is emitted from inside the draw, so it cannot
          # be reported by a launcher that never rendered the surface.
          qualify_party_surface() {
            local label="$1" executable="$2" launch_cwd="$3"
            local expected_origin="${PARTY_ORIGIN:-unset}"
            local party="$RUNNER_TEMP/launcher-party/$label"
            mkdir -p "$party/prefs" "$party/saves"
            (
              cd "$launch_cwd"
              xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
                env -u SDL_VIDEODRIVER -u MDKR_RENDERER \
                  MDKR_APP_SMOKE_FRAMES=4 \
                  MDKR_APP_PANEL=Play MDKR_APP_PARTY_TRACE=1 \
                  MDKR_APP_PREFS_DIR="$party/prefs" \
                  MDKR_VIDEO_CONFIG_PATH="$party/video.ini" \
                  MDKR_SAVE_DIR="$party/saves" MDKR_AUDIO=0 \
                  "$executable"
            ) 2>&1 | tee "$party/launcher.log"
            local count line expected_prefix
            count="$(grep -cE '^\[app\] party: ' "$party/launcher.log" || true)"
            if [[ "$count" != "1" ]]; then
              echo "$label: expected exactly one [app] party: line, got $count" >&2
              exit 1
            fi
            line="$(grep -E '^\[app\] party: ' "$party/launcher.log")"
            expected_prefix="[app] party: origin=$expected_origin transport=available "
            if [[ "$line" != "$expected_prefix"* ]]; then
              echo "$label: party trace mismatch -- this artifact does not" >&2
              echo "report the origin it was supposed to be built with." >&2
              echo "  expected prefix: $expected_prefix" >&2
              echo "  actual line    : $line" >&2
              exit 1
            fi
            # Belt and braces on the partyful path: an artifact built for a
            # deployed service must never report origin=unset, which is what a
            # build that ships Phone Party hidden entirely would print.
            if [[ -n "${PARTY_ORIGIN:-}" && "$line" == *"origin=unset"* ]]; then
              echo "$label: artifact reports origin=unset but this release was built for ${PARTY_ORIGIN}" >&2
              exit 1
            fi
            echo "$label: party surface drew, $line"
          }

          qualify_party_surface built "$GITHUB_WORKSPACE/build/mdkr64" \
            "$GITHUB_WORKSPACE"
      - name: Package AppImage + tar.gz
        run: ./tools/package_linux_appimage.sh --binary build/mdkr64 --version "${{ needs.validate.outputs.version }}"
      - name: Qualify extracted tar/AppRun from an unrelated directory
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          set -euo pipefail
          extract="$RUNNER_TEMP/linux-package"
          unrelated="$RUNNER_TEMP/unrelated-launch-cwd"
          mkdir -p "$extract" "$unrelated" "$RUNNER_TEMP/launcher-package"
          tar -xzf "dist/Golden-Balloon-$RELEASE_VERSION-linux-x86_64.tar.gz" \
            -C "$extract"
          app_run="$extract/Golden-Balloon.AppDir/AppRun"
          binary="$extract/Golden-Balloon.AppDir/usr/bin/mdkr64"
          lib_dir="$extract/Golden-Balloon.AppDir/usr/lib"
          test -x "$app_run"
          LD_LIBRARY_PATH="$lib_dir" ldd "$binary" | \
            grep -E "libSDL2[^ ]* => $lib_dir/libSDL2[^ ]*"

          # Version stamp + Phone Party evidence for the artifact players get,
          # not for the tree it was built from. The version fed to the smoke is
          # read back out of the packaged launcher itself.
          package_version="$(cd "$unrelated" && "$app_run" --version | tr -d '\r')"
          test "$package_version" = "mdkr64 $RELEASE_VERSION"
          if [[ -n "${PARTY_ORIGIN:-}" ]]; then
            python3 tests/check_party_binary_surface.py "$binary" \
              --expect-origin "$PARTY_ORIGIN"
          else
            echo "Partyless build: packaged Phone Party surface assertion is intentionally absent."
          fi
          MDKR_PARTY_BRINGUP_VERSION="${package_version#mdkr64 }" \
            "$GITHUB_WORKSPACE/build/mdkr_native_party_bringup_test" \
            | tee "$RUNNER_TEMP/party-bringup-package.txt"
          grep -qE "^\[party-bringup\] version=${RELEASE_VERSION} .* ok=1\$" \
            "$RUNNER_TEMP/party-bringup-package.txt"

          qualify_package() {
            local label="$1" renderer="$2"
            local work="$RUNNER_TEMP/launcher-package/$label"
            mkdir -p "$work/prefs" "$work/saves"
            local -a backend=(-u MDKR_RENDERER)
            [[ -z "$renderer" ]] || backend=(MDKR_RENDERER="$renderer")
            (
              cd "$unrelated"
              xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
                env -u SDL_VIDEODRIVER "${backend[@]}" \
                  MDKR_APP_SMOKE_FRAMES=4 \
                    MDKR_APP_SMOKE_SHOT="$work/launcher.bmp" \
                  MDKR_APP_PANEL=Settings MDKR_APP_UI_TRACE=1 \
                  MDKR_APP_REQUIRE_PRESENT=1 \
                  MDKR_APP_PREFS_DIR="$work/prefs" \
                  MDKR_VIDEO_CONFIG_PATH="$work/video.ini" \
                  MDKR_SAVE_DIR="$work/saves" MDKR_AUDIO=0 \
                  "$app_run"
            ) 2>&1 | tee "$work/launcher.log"
            if [[ -z "$renderer" ]]; then
              grep -Fq '[app] host: WebGPU' "$work/launcher.log"
              grep -Eq '^\[app\] smoke: surface presents=[1-9][0-9]*$' \
                "$work/launcher.log"
            else
              grep -Fq '[app] host: OpenGL' "$work/launcher.log"
            fi
            python3 tests/check_app_capture.py "$work/launcher.bmp" --self-test
          }

          qualify_package webgpu ""
          qualify_package gl gl

          # Phone Party surface witness for the artifact players actually get.
          # Same seam and same honest limits as the built-tree step above: the
          # party section is on the Play panel, MDKR_APP_PARTY_TRACE=1 makes it
          # draw without a ROM and emits one line from inside the draw. An
          # origin-less build hides the surface from players entirely, so a
          # nonempty origin here is evidence the packaged launcher really
          # offers it. Phase is `closed` and invite/qr/code are 0 in an offline
          # lane; asserting otherwise would be an assertion that cannot hold.
          # Pixels and presents belong to the four qualification runs above;
          # this run exists only for the trace, which is emitted from inside
          # the draw and so cannot come from a launcher that never rendered.
          party_work="$RUNNER_TEMP/launcher-party-package"
          expected_origin="${PARTY_ORIGIN:-unset}"
          mkdir -p "$party_work/prefs" "$party_work/saves"
          (
            cd "$unrelated"
            xvfb-run -a -s '-screen 0 1280x800x24 +extension GLX +render -noreset' \
              env -u SDL_VIDEODRIVER -u MDKR_RENDERER \
                MDKR_APP_SMOKE_FRAMES=4 \
                MDKR_APP_PANEL=Play MDKR_APP_PARTY_TRACE=1 \
                MDKR_APP_PREFS_DIR="$party_work/prefs" \
                MDKR_VIDEO_CONFIG_PATH="$party_work/video.ini" \
                MDKR_SAVE_DIR="$party_work/saves" MDKR_AUDIO=0 \
                "$app_run"
          ) 2>&1 | tee "$party_work/launcher.log"
          party_count="$(grep -cE '^\[app\] party: ' "$party_work/launcher.log" || true)"
          if [[ "$party_count" != "1" ]]; then
            echo "package: expected exactly one [app] party: line, got $party_count" >&2
            exit 1
          fi
          party_line="$(grep -E '^\[app\] party: ' "$party_work/launcher.log")"
          party_expected="[app] party: origin=$expected_origin transport=available "
          if [[ "$party_line" != "$party_expected"* ]]; then
            echo "package: party trace mismatch -- the packaged artifact does" >&2
            echo "not report the origin it was supposed to be built with." >&2
            echo "  expected prefix: $party_expected" >&2
            echo "  actual line    : $party_line" >&2
            exit 1
          fi
          if [[ -n "${PARTY_ORIGIN:-}" && "$party_line" == *"origin=unset"* ]]; then
            echo "package: artifact reports origin=unset but this release was built for ${PARTY_ORIGIN}" >&2
            exit 1
          fi
          echo "package: party surface drew, $party_line"
      - name: Stamp provenance (bind assets to this commit)
        run: |
          for f in dist/Golden-Balloon-*-linux-x86_64.*; do
            case "$f" in *.provenance.json) continue ;; esac
            ./tools/release/stamp_provenance.sh "$f" "${{ needs.validate.outputs.version }}"
          done
      # Fail closed between stamping and upload: every artifact about to leave
      # this job must carry a sidecar binding it to this exact commit, and no
      # unrecognised or cross-version artifact may be sitting in dist/.
      - name: Verify provenance of every artifact before upload
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./tools/release/verify_provenance.sh \
            --dist dist \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --require platform=linux \
            --out-checksums "$RUNNER_TEMP/linux-SHA256SUMS.txt" \
            --out-manifest "$RUNNER_TEMP/linux-manifest.json"
          cat "$RUNNER_TEMP/linux-SHA256SUMS.txt"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: Golden-Balloon-${{ needs.validate.outputs.version }}-linux-x86_64
          path: dist/Golden-Balloon-${{ needs.validate.outputs.version }}-linux-x86_64.*

  windows:
    # No automatic publishing by design. A windows-latest VM is useful for ABI, import,
    # packaging, and native execution checks, but is not a stable GPU
    # qualification environment. Preserve the validated zip as a workflow
    # artifact, but do not add automatic release attachment until the built and
    # extracted launchers pass content-validated WebGPU and explicit-GL captures
    # on a qualified runner.
    name: Windows portable validation (automatic publishing disabled)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: msys2/setup-msys2@d40200dc2db4c351366b048a9565ad82919e1c24 # v2
        with:
          # UCRT64, not MINGW64: MINGW64 executables link the legacy
          # msvcrt.dll, whose fopen rejects the C11 'x' flag every atomic
          # settings write here depends on. The withdrawn v1.2.1 Windows zip
          # shipped from a MINGW64 build and could not save any preference
          # (issue #32). fs_utf8.c now implements exclusive create CRT-
          # independently, and this lane pins the UCRT — the same CRT the
          # qualified v1.2.0 artifact linked and the flavor MSYS2 itself
          # recommends for new projects.
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python zip unzip
            diffutils
      - name: Verify declared Python toolchain
        run: python3 --version
      - name: Build the app (Release)
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          # Same gated value as the Linux lane. A maintainer may hand-attach the
          # exact archive after real-hardware acceptance, so it must carry the
          # same deliberate partyful or partyless decision as every other build.
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DMDKR_VERSION="$RELEASE_VERSION" \
            -DMDKR_PARTY_ORIGIN="$PARTY_ORIGIN"
          # The full ROM-free suite runs in the cross-platform correctness
          # matrix. This Windows lane builds the product plus the native
          # formatter/allocator sentinel that exercises MinGW CRT
          # compatibility, plus the Phone Party host gates -- those need no
          # GPU, window or network, so the documented GPU limitation that
          # keeps a launcher gate off this runner does not apply to them.
          cmake --build build --target mdkr64 mdkr_memory_allocator_test \
            mdkr_native_party_bringup_test mdkr_native_party_host_test \
            mdkr_native_party_qr_test mdkr_native_party_sas_test -j
      - name: Verify portable executable
        run: |
          version_output="$(./build/mdkr64.exe --version | tr -d '\r')"
          test "$version_output" = "mdkr64 ${{ needs.validate.outputs.version }}"
          if [[ "${{ needs.validate.outputs.version }}" == "dev" ]]; then
            manifest_version="0.0.0.0"
          else
            # The validate job accepts a two-part version (1.0) as well as a
            # three-part one, and CMake pads the missing components with zeros
            # to build the 4-part manifest/FILEVERSION identity. Default the
            # same way here: without it "1.0" produced "1.0..0" and could never
            # match the "1.0.0.0" CMake actually embedded.
            IFS=. read -r manifest_major manifest_minor manifest_patch <<< "${{ needs.validate.outputs.version }}"
            manifest_version="${manifest_major:-0}.${manifest_minor:-0}.${manifest_patch:-0}.0"
          fi
          python3 - "$manifest_version" build/mdkr64.exe <<'PY'
          import re
          import sys
          from pathlib import Path

          version, executable = sys.argv[1:]
          expected = re.compile(
              rb'<assemblyIdentity\s+version="' + re.escape(version.encode()) +
              rb'"\s+processorArchitecture="amd64"\s+name="GoldenBalloon"\s+'
              rb'type="win32"/>')
          data = Path(executable).read_bytes()
          if expected.search(data) is None:
              raise SystemExit(
                  f"embedded manifest identity missing or wrong for {version}")
          print(f"embedded manifest identity: {version}")
          required = {
              "long paths": b">true</longPathAware>",
              "UTF-8 active code page": b">UTF-8</activeCodePage>",
          }
          missing = [label for label, marker in required.items()
                     if marker not in data]
          if missing:
              raise SystemExit(
                  "embedded manifest missing: " + ", ".join(missing))
          print("embedded manifest Windows settings: UTF-8 + long paths")
          PY
          ./tools/check_windows_imports.sh build/mdkr64.exe
          ./macos/Scripts/verify_asset_free.sh build/mdkr64.exe
          # The MinGW CRT portability sentinel stays its own exact invocation so
          # the CI contract can pin it; the GPU-free party host gates run as a
          # separate selection right after.
          ctest --test-dir build --output-on-failure --no-tests=error -R '^memory_allocator$'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^(native_party_bringup|native_party_host|native_party_qr|native_party_sas)$'
      # GPU-free by construction, so this lane can carry it despite having no
      # qualifying adapter for a launcher gate. Same honest limits as Linux:
      # host pairing surface + linkage, not an on-screen QR or a live listener.
      - name: Phone Party bring-up smoke and linked-transport check
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          set -euo pipefail
          built_version="$(./build/mdkr64.exe --version | tr -d '\r')"
          test "$built_version" = "mdkr64 $RELEASE_VERSION"
          MDKR_PARTY_BRINGUP_VERSION="${built_version#mdkr64 }" \
            ./build/mdkr_native_party_bringup_test.exe \
            | tee "$RUNNER_TEMP/party-bringup-built.txt"
          grep -qE "^\[party-bringup\] version=${RELEASE_VERSION} .* ok=1\$" \
            "$RUNNER_TEMP/party-bringup-built.txt"
          if [[ -n "${PARTY_ORIGIN:-}" ]]; then
            python3 tests/check_party_binary_surface.py build/mdkr64.exe \
              --expect-origin "$PARTY_ORIGIN"
          else
            echo "Partyless build: packaged Phone Party surface assertion is intentionally absent."
          fi
      - name: Smoke-launch ROM-free early-exit surfaces
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./build/mdkr64.exe --help > help.txt
          grep -q '^Usage: ' help.txt
          ./build/mdkr64.exe --video-list > video.txt
          grep -qE '^\[video\] mode=' video.txt
      - name: Package portable .zip (GoldenBalloon.exe (static SDL2, no DLLs))
        run: ./tools/package_windows_zip.sh --binary build/mdkr64.exe --version "${{ needs.validate.outputs.version }}"
      - name: Verify extracted package startup from an unrelated directory
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PARTY_ORIGIN: ${{ needs.validate.outputs.party_origin }}
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          package_root="$runner_temp/windows-package"
          unrelated="$runner_temp/unrelated-launch-cwd"
          mkdir -p "$package_root" "$unrelated"
          unzip -q "dist/Golden-Balloon-$RELEASE_VERSION-windows-x64.zip" \
            -d "$package_root"
          executable="$package_root/GoldenBalloon/GoldenBalloon.exe"
          test "$(sha256sum build/mdkr64.exe | awk '{print $1}')" = \
            "$(sha256sum "$executable" | awk '{print $1}')"
          # Info-ZIP on MSYS does not preserve an executable mode from a ZIP
          # created on Windows. Restore it only for this Bash launch check;
          # Explorer uses the PE extension and does not depend on POSIX mode.
          chmod +x "$executable"
          (
            cd "$unrelated"
            version_output="$("$executable" --version | tr -d '\r')"
            test "$version_output" = "mdkr64 $RELEASE_VERSION"
            "$executable" --help > help.txt
            grep -q '^Usage: ' help.txt
          )
          # Partyful builds must prove that the packaged .exe carries the
          # configured cloud surface. Partyless builds deliberately omit it.
          if [[ -n "${PARTY_ORIGIN:-}" ]]; then
            python3 tests/check_party_binary_surface.py "$executable" \
              --expect-origin "$PARTY_ORIGIN"
          else
            echo "Partyless build: packaged Phone Party surface assertion is intentionally absent."
          fi
          MDKR_PARTY_BRINGUP_VERSION="$RELEASE_VERSION" \
            ./build/mdkr_native_party_bringup_test.exe \
            | tee "$RUNNER_TEMP/party-bringup-package.txt"
          grep -qE "^\[party-bringup\] version=${RELEASE_VERSION} .* ok=1\$" \
            "$RUNNER_TEMP/party-bringup-package.txt"
      # The doctrine stays: Windows PUBLICATION is a human decision made after
      # real-hardware testing, never an automatic side effect. What changes is
      # WHICH bytes that human accepts. Discarding the validated zip forced the
      # owner to rebuild locally, so the archive that shipped was never the
      # archive this lane qualified -- the withdrawn v1.2.1 zip is what that
      # gap costs. Stamp and preserve the qualified bytes as a WORKFLOW
      # artifact (not a release attachment); manual acceptance then attaches
      # exactly what was validated, provenance sidecar and all.
      - name: Stamp provenance (bind the validated zip to this commit)
        run: |
          ./tools/release/stamp_provenance.sh \
            "dist/Golden-Balloon-${{ needs.validate.outputs.version }}-windows-x64.zip" \
            "${{ needs.validate.outputs.version }}"
      - name: Verify provenance of every artifact before upload
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./tools/release/verify_provenance.sh \
            --dist dist \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --require platform=windows \
            --out-checksums "$RUNNER_TEMP/windows-SHA256SUMS.txt" \
            --out-manifest "$RUNNER_TEMP/windows-manifest.json"
          cat "$RUNNER_TEMP/windows-SHA256SUMS.txt"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: Golden-Balloon-${{ needs.validate.outputs.version }}-windows-x64
          path: |
            dist/Golden-Balloon-*-windows-x64.zip
            dist/Golden-Balloon-*-windows-x64.zip.provenance.json
          if-no-files-found: error
      - name: Confirm Windows publication remains manual
        run: |
          echo "Validated Windows archive preserved as a workflow artifact; publication remains manual, and only this exact accepted archive may be attached."
