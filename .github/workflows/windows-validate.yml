# Windows EXECUTION validation lane.
#
# Adapted from mgb64's .github/workflows/windows-validate.yml. The credibility
# gate that proves the Windows build RUNS, not just compiles. The local
# cross-compile check (tools/mingw_cross_check.sh) proves compile+link from a
# macOS/Linux host; this lane closes the "verified by execution" gap: it
# builds mdkr64.exe on a real windows-latest kernel via MSYS2 (mirroring the
# release.yml Windows job exactly), then EXERCISES it:
#
#   1. Import-table guard on real Windows — the libgcc_s_seh regression class
#      (a non-self-contained exe that dies "DLL not found" on a player's PC) is
#      caught here, on the actual toolchain, not on a player's machine.
#   2. Headless execution smoke — drives the ROM-free surfaces (--help,
#      --video-list; see platform/main_pc.c) with SDL dummy drivers. This
#      exercises real Windows process startup and the video-config
#      report/CLI-parsing logic on a real kernel. No ROM, no GPU.
#   3. ROM-free CTest suite — the compiled C/C++ unit tests run as native
#      Windows executables. correctness.yml already proves this same ctest
#      suite is ROM-free and headless-safe on Linux/macOS runners (no Xvfb,
#      no ROM); this step proves the same for Windows. mdkr64's CMakeLists.txt
#      does not tag tests with ctest LABELS, and this repo has active work on
#      platform/audio*/ that may add or rename audio-adjacent tests, so this
#      excludes by name pattern (audio/mixer) rather than hardcoding an
#      include-list of exact test names that could silently go stale.
#   4. Exact portable packaging plus extracted startup from an unrelated CWD.
#
# This is deliberately not a publication lane. GitHub's windows-latest VM does
# not promise a qualifying D3D12/Vulkan adapter or GL 3.3 context. Treating the
# GPU-free surfaces above as a launcher-render substitute would recreate the
# release-gate bug this audit is closing. Accordingly this workflow uploads no
# executable or zip; Windows publication stays held until the built and
# extracted launchers can both produce content-validated default-WebGPU and
# explicit-GL captures on a stable GPU runner.
#
# Manual-only (workflow_dispatch), matching the repo's deliberate
# no-auto-trigger posture for release/validation lanes (see release.yml,
# macos-release.yml). A maintainer dispatches this and it should be GREEN
# before a release cut. It needs no secrets and writes no repository state —
# it only compiles and validates the ASSET-FREE source, consistent with the
# bring-your-own-ROM provenance policy.
#
# tools/mingw_cross_check.sh and cmake/mingw-w64-x86_64.cmake (referenced by
# path above) and macos/Scripts/verify_asset_free.sh (the last step) all
# landed on `main` via their respective ports during the development of this
# workflow.

name: Windows validate (execution)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validate:
    name: Windows build + execute (windows-latest / MSYS2)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Mirror release.yml's Windows toolchain EXACTLY (same MINGW64 msystem,
      # same package set) so the build half is known-good by construction. `python`
      # is added for the asset-free verifier's ROM-magic byte scan (a Python
      # heredoc) and for the save_cli ctest; it is not needed by the build.
      - uses: msys2/setup-msys2@d40200dc2db4c351366b048a9565ad82919e1c24 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config mingw-w64-x86_64-ninja zip unzip python

      # Same CMake config as the release.yml Windows job, plus BUILD_TESTING
      # (ON by default via include(CTest) in CMakeLists.txt) so the ROM-free
      # CTest unit exes are produced alongside mdkr64.exe. No --target filter:
      # the default build target builds mdkr64 plus every ctest executable.
      - name: Build the app + ROM-free test exes (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          test -f build/mdkr64.exe || { echo "FAIL: build/mdkr64.exe missing"; exit 1; }
          file build/mdkr64.exe

      # Import-table guard (the same check tools/mingw_cross_check.sh runs, here on
      # the REAL Windows toolchain's objdump). The exe must import only Windows
      # COMDLG32.dll is on the list deliberately: the app shell's ROM picker uses
      # GetOpenFileNameW (platform/app/file_dialog_win.cpp) so the player can
      # select their own file without the launcher enumerating any directory.
      # It is a stock Windows system DLL, present on every install.
      # SDL2, libgcc, libstdc++, and winpthread are static. The shared import
      # guard permits only stock Windows DLLs (including wgpu-native's
      # D3D12/DXGI/BCRYPT family) and rejects an SDL2/toolchain DLL regression.
      - name: Import-table guard (self-contained on stock Windows)
        run: ./tools/check_windows_imports.sh build/mdkr64.exe

      # Headless EXECUTION smoke: prove the exe RUNS on a real kernel without a
      # ROM. SDL dummy drivers so no display/GPU is required. Each command must
      # exit 0 and print its expected marker. mdkr64 fails fast without a ROM
      # (platform/main_pc.c), so --help and --video-list are the only two
      # execution paths that return before ROM/window/audio initialization --
      # this exercises process startup + CRT + static runtimes and the
      # video-config CLI/report logic on a real kernel.
      - name: Headless execution smoke (ROM-free surfaces)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e
          echo "--- (a) --help ---"
          ./build/mdkr64.exe --help > help.txt 2>help.err
          cat help.txt
          grep -q '^Usage: ' help.txt

          echo "--- (b) --video-list (resolved video config report) ---"
          ./build/mdkr64.exe --video-list > video.txt 2>video.err
          cat video.txt
          grep -qE '^\[video\] mode=' video.txt

          echo "PASS: all ROM-free execution surfaces ran and produced expected output."

      # ROM-free CTest suite: the compiled C/C++ unit tests, run as native
      # Windows exes. correctness.yml runs this identical suite on Linux and
      # macOS runners with no Xvfb and no ROM, so it is proven ROM-free and
      # headless-safe by construction; this proves the same on Windows.
      # GPU-labelled tests need a real display and are exercised by packaged
      # release lanes. The audio name exclusion remains broad because new
      # audio-adjacent tests may arrive under platform/audio*/.
      - name: ROM-free CTest suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ctest --test-dir build --output-on-failure -LE gpu -E 'audio|mixer'

      # Asset-free verify (mirror the release job's post-build check): the binary
      # must contain no ROM-derived copyrighted data. MSYS2 `nm` reads the PE and
      # the ROM-magic byte scan is portable Python.
      - name: Verify asset-free
        run: ./macos/Scripts/verify_asset_free.sh build/mdkr64.exe

      - name: Package and verify extracted startup (not published)
        run: |
          set -euo pipefail
          ./tools/package_windows_zip.sh --binary build/mdkr64.exe --version dev
          expected_version="$(./build/mdkr64.exe --version | tr -d '\r')"
          package_root="$RUNNER_TEMP/windows-package"
          unrelated="$RUNNER_TEMP/unrelated-launch-cwd"
          mkdir -p "$package_root" "$unrelated"
          unzip -q dist/Golden-Balloon-dev-windows-x64.zip -d "$package_root"
          executable="$package_root/GoldenBalloon/GoldenBalloon.exe"
          (
            cd "$unrelated"
            version_output="$("$executable" --version | tr -d '\r')"
            test "$version_output" = "$expected_version"
            "$executable" --help > help.txt
            grep -q '^Usage: ' help.txt
          )
          echo "Windows artifact not uploaded: hosted GPU launcher qualification is unavailable."
