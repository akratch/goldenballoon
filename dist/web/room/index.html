<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#071a30">
  <meta name="referrer" content="no-referrer">
  <title>Join a Golden Balloon room</title>
  <link rel="stylesheet" href="room-entry.css">
</head>
<body>
  <a class="skip-link" href="#room-entry-main">Skip to room status</a>
  <main id="room-entry-main" tabindex="-1" aria-labelledby="room-entry-title">
    <p class="eyebrow">Private online play</p>
    <h1 id="room-entry-title" tabindex="-1">Opening the Room…</h1>
    <p id="room-entry-status" role="status" aria-live="polite">
      Moving this private invitation into the game launcher.
    </p>
    <noscript>
      JavaScript is required to open a private room. You can still open Golden
      Balloon and enter the six-digit room code.
    </noscript>
    <a href="../">Open Golden Balloon</a>
  </main>
  <script src="room-entry.js"></script>
</body>
</html>
